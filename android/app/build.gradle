plugins {
    id 'com.android.application'
}

// The game lives in ../index.html; copy it into the APK at build time,
// pointing the Google Fonts link at the bundled copies so it works offline.
def webDir = layout.buildDirectory.dir('generated/web')
def copyWeb = tasks.register('copyWeb', Copy) {
    from(rootProject.file('../index.html'))
    into(webDir)
    filter { String line ->
        line.replaceAll(/<link rel="preconnect"[^>]*>/, '')
            .replaceAll(/<link rel="stylesheet" href="https:\/\/fonts\.googleapis\.com[^>]*>/,
                '<link rel="stylesheet" href="fonts.css">')
    }
}

android {
    namespace 'com.livewire.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.livewire.game'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName System.getenv('VERSION_NAME') ?: '1.0'
    }

    // A fixed key so every CI build can install over the previous one
    // without losing saved progress. Replace it before publishing to a store.
    signingConfigs {
        shared {
            storeFile file('livewire.keystore')
            storePassword 'livewire'
            keyAlias 'livewire'
            keyPassword 'livewire'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    sourceSets {
        main.assets.srcDirs += webDir.get().asFile
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild') { dependsOn copyWeb }

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.9.3'
}
